apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: spark-history-server
  namespace: argocd
  annotations:
    # Let the API server compute the diff (dry-run apply). Kubernetes 1.37 fills in StatefulSet defaults
    # (e.g. updateStrategy.rollingUpdate.maxUnavailable, persistentVolumeClaimRetentionPolicy) that Argo CD's
    # client-side diff does not know, which showed the app as OutOfSync although nothing differed.
    argocd.argoproj.io/compare-options: ServerSideDiff=true
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://kubedai.github.io/spark-history-server
    chart: spark-history-server
    targetRevision: "1.5.1"
    helm:
      values: |
        ${user_values_yaml}

  destination:
    server: https://kubernetes.default.svc
    namespace: spark-history-server
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
